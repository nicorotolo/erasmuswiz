<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1410">
<title>Salento Quest — Roma → Torre Pali</title>
<meta name="description" content="La mappa del viaggio in Salento: 7 giornate, 20 tappe, un pin alla volta.">

<!-- Anteprima quando il link viene incollato su WhatsApp -->
<meta property="og:type" content="website">
<meta property="og:title" content="SALENTO QUEST — Roma → Torre Pali">
<meta property="og:description" content="La mappa del viaggio: 7 giornate, 20 tappe. Scegli l'omino e comincia.">
<meta property="og:image" content="https://nicorotolo.github.io/erasmuswiz/salento/img/anteprima.png">
<meta property="og:url" content="https://nicorotolo.github.io/erasmuswiz/salento/">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2316467f'/%3E%3Crect x='2' y='3' width='9' height='11' fill='%236ea340'/%3E%3Crect x='6' y='5' width='3' height='3' fill='%23f0c341'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/stile.css">
</head>
<body>

<div id="app">

  <!-- ================= TESTATA ================= -->
  <div class="testa-fissa">
    <header>
      <div class="riga-1">
        <div id="mini-av" aria-hidden="true"></div>
        <div class="titoli">
          <h1 id="titolo">SALENTO QUEST</h1>
          <p id="sotto">Roma → Torre Pali</p>
        </div>
        <div class="bottoni-testata">
          <button type="button" id="btn-badge" class="btn-t">🏅 0/7</button>
          <button type="button" id="btn-menu" class="btn-t" aria-label="Menu">⚙</button>
        </div>
      </div>

      <div class="riga-2">
        <span id="saluto"></span>
        <div id="barra" role="progressbar" aria-label="Tappe completate"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="barra-riemp"></div>
        </div>
        <span id="conteggio">0/20</span>
      </div>
    </header>

    <nav id="rail" aria-label="Giornate del viaggio"></nav>
    <div id="elenco-giorno" hidden></div>
  </div>

  <!-- ================= MAPPA ================= -->
  <div id="mappa-wrap">
    <div id="mappa-int">
      <canvas id="mappa" aria-label="Mappa del Salento con le tappe del viaggio" role="img"></canvas>
      <div id="pin-strato"></div>
    </div>
  </div>

  <!-- ================= MENU ================= -->
  <div id="menu" hidden>
    <button type="button" id="menu-condividi">📨  Manda agli amici</button>
    <button type="button" id="menu-cambia">🧢  Cambia nome / omino</button>
    <button type="button" id="menu-azzera">🗑  Azzera i progressi</button>
  </div>

</div>

<!-- ================= SCHEDA DELLA TAPPA ================= -->
<div id="scheda-fondo" hidden></div>

<div id="scheda" hidden role="dialog" aria-modal="true" aria-labelledby="sc-nome">
  <div class="sc-testa">
    <div>
      <div id="sc-giorno"></div>
      <h2 id="sc-nome"></h2>
      <div id="sc-num"></div>
    </div>
    <button type="button" id="sc-chiudi" aria-label="Chiudi">×</button>
  </div>

  <div class="sc-corpo">
    <p id="sc-cosa"></p>

    <div class="riga-info" id="sc-consiglio-riga">
      <span class="ic" aria-hidden="true">💡</span>
      <span id="sc-consiglio"></span>
    </div>

    <div class="riga-info" id="sc-canzone-riga">
      <span class="ic" aria-hidden="true">🎵</span>
      <span id="sc-canzone"></span>
    </div>

    <div id="sc-foto"></div>

    <button type="button" id="sc-fatta">SEGNA COME FATTA</button>
  </div>
</div>

<input type="file" id="file-foto" accept="image/*" hidden>

<!-- ================= BADGE ================= -->
<div id="badge-modale" hidden role="dialog" aria-modal="true" aria-label="Badge">
  <div class="modale-int">
    <h2>🏅 BADGE</h2>
    <div id="badge-lista"></div>
    <button type="button" id="badge-chiudi">CHIUDI</button>
  </div>
</div>

<!-- ================= AVVISI ================= -->
<div id="avviso" role="status" aria-live="polite"></div>

<!-- ================= SCHERMATA INIZIALE ================= -->
<div id="intro" hidden>
  <div class="intro-int">
    <h1 id="intro-titolo">SALENTO QUEST</h1>
    <p id="intro-sotto">Roma → Torre Pali</p>

    <div id="intro-auto" aria-hidden="true"></div>

    <label class="intro-etichetta" for="intro-nome">COME TI CHIAMI?</label>
    <input type="text" id="intro-nome" maxlength="14" placeholder="NOME"
           autocomplete="off" autocapitalize="characters">

    <span class="intro-etichetta">SCEGLI IL TUO OMINO</span>
    <div id="intro-avatar"></div>

    <button type="button" id="intro-inizia">INIZIA</button>

    <p class="nota">
      Progressi e foto restano su questo telefono.<br>
      Ognuno ha la sua partita.
    </p>
  </div>
</div>

<script src="js/dati-tappe.js"></script>
<script src="js/pixel.js"></script>
<script src="js/mappa.js"></script>
<script src="js/app.js"></script>
</body>
</html>
