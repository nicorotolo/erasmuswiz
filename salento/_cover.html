<!DOCTYPE html>
<!-- Pagina di servizio: serve solo a generare img/anteprima.png (l'immagine
     che WhatsApp mostra quando si incolla il link). Non e' parte del sito. -->
<html lang="it">
<head>
<meta charset="utf-8">
<title>cover</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #1b1410;
    font-family: ui-monospace, 'Courier New', monospace;
    color: #f6ecd2;
    display: flex; align-items: center;
  }
  .sx { flex: 1 1 auto; padding: 0 40px 0 70px; }
  h1 { font-size: 62px; letter-spacing: 6px; color: #f0c341;
       text-shadow: 6px 6px 0 #0e0a07; line-height: 1.2; }
  .sub { margin-top: 18px; font-size: 24px; letter-spacing: 4px; color: #d8c8a6; }
  .dati { margin-top: 26px; font-size: 19px; letter-spacing: 2px; color: #8cbb54; }
  .omini { margin-top: 34px; display: flex; gap: 14px; }
  .omini div { width: 60px; height: 60px; background: center/contain no-repeat;
               image-rendering: pixelated; }
  .dx { flex: 0 0 auto; padding-right: 60px; }
  canvas { image-rendering: pixelated; display: block;
           border: 5px solid #0e0a07; box-shadow: 10px 10px 0 rgba(0,0,0,.45); }
</style>
</head>
<body>
  <div class="sx">
    <h1>SALENTO<br>QUEST</h1>
    <div class="sub">Roma → Torre Pali</div>
    <div class="dati">7 GIORNATE · 20 TAPPE</div>
    <div class="omini" id="omini"></div>
  </div>
  <div class="dx"><canvas id="mappa"></canvas></div>

<script src="js/dati-tappe.js"></script>
<script src="js/pixel.js"></script>
<script src="js/mappa.js"></script>
<script>
  var D = window.DATI_VIAGGIO;
  ['a1', 'a3', 'a4', 'a2'].forEach(function (id) {
    var d = document.createElement('div');
    d.style.backgroundImage = 'url(' + window.Pixel.urlAvatar(id) + ')';
    document.getElementById('omini').appendChild(d);
  });

  var colori = {};
  D.giorni.forEach(function (g) { colori[g.n] = g.colore; });

  var casa = new Image();
  casa.onload = function () {
    window.Mappa.adatta(48 * 8.6);
    window.Mappa.disegna(document.getElementById('mappa'), D.tappe, D.base, casa, colori);
    document.body.dataset.pronto = '1';
  };
  casa.src = window.Pixel.urlCasa();
</script>
</body>
</html>
